name: Build renamed engine

# Takes the latest ONScripter-NEW Android release as-is, renames it to
# "Umineko no Naku Koro ni" with the Beatrice icon (engine-mod/), re-signs it
# and publishes it as a release. Manual only: the published engine is now
# built from source with the Bluetooth audio fix (engine-source.yml).
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: Umineko no Naku Koro ni

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download apktool and ONScripter-NEW
        run: |
          for v in 2.12.1 2.12.0 2.11.1 2.10.0; do
            if curl -fsSL -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v$v/apktool_$v.jar"; then
              echo "apktool $v"; break
            fi
          done
          curl -fsSL -o ons.apk https://github.com/timftw21/onscripter-new/releases/latest/download/onscripter-new-android.apk
          ls -la apktool.jar ons.apk

      - name: Rename and change icon
        run: |
          java -jar apktool.jar d -f -o dec ons.apk
          python3 engine-mod/patch.py dec "$APP_NAME"
          grep -o '<application[^>]*>' dec/AndroidManifest.xml
          java -jar apktool.jar b dec -o unsigned.apk

      - name: Align and sign
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks app/installer.keystore --ks-pass pass:android \
            --ks-key-alias installer --key-pass pass:android \
            --out Umineko-no-Naku-Koro-ni.apk aligned.apk
          "$BT/apksigner" verify Umineko-no-Naku-Koro-ni.apk
          "$BT/aapt2" dump badging Umineko-no-Naku-Koro-ni.apk | grep -E "^(package|application-label|application:|native-code)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Umineko-no-Naku-Koro-ni
          path: Umineko-no-Naku-Koro-ni.apk

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete umineko-engine --yes --cleanup-tag || true
          gh release create umineko-engine Umineko-no-Naku-Koro-ni.apk \
            --target "$GITHUB_SHA" \
            --title "Umineko no Naku Koro ni (ONScripter-NEW engine, renamed)" \
            --notes "The ONScripter-NEW 64-bit engine with the name \"Umineko no Naku Koro ni\" and the Beatrice icon. Uninstall the original ONScripter-NEW first (your game folder and saves stay), install this, then choose your game folder."
