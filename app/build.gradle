plugins {
    id 'com.android.application'
}

android {
    namespace 'org.umineko.installer'
    compileSdk 34

    defaultConfig {
        applicationId 'org.umineko.installer'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '1.9'
    }

    signingConfigs {
        // Fixed key so a newer build can be installed over an older one.
        shared {
            storeFile file('installer.keystore')
            storePassword 'android'
            keyAlias 'installer'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
}
